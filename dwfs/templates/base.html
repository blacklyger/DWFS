<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=0">
    <title>DWFS</title>
    <link rel="icon" href="{{ url_for('static', filename='dwfs_icon.ico') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.7.2/css/bulma.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css')}}" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="{{ url_for('static', filename='js/base.js') }}"></script>
</head>

<body>

    <nav class="bd-navbar navbar is-dark has-shadow is-spaced" role="navigation" aria-label="main navigation">

        <div class="container">

            <div class="navbar-burger burger">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="navbar-menu is-active">

                <div class="navbar-start">
                    <div class="navbar-item">
                        <h1 id="office"><a href="{{ url_for('main.index') }}" style="color: white;">DWFS</a></h1>
                    </div>
                </div>

                <div class="navbar-end">

                    <div class="navbar-start">
                        <a href="{{ url_for('main.index') }}" class="navbar-item">
                            Startseite
                        </a>
                        {% if current_user.is_authenticated %}

                        <a href="{{ url_for('main.subjects') }}" class="navbar-item">
                            <strong>Fächerübersicht</strong>
                        </a>

                        <a href="{{ url_for('main.profile') }}" class="navbar-item">
                            <strong>Profil</strong>
                        </a>

                        <a href="{{ url_for('auth.logout') }}" class="navbar-item">
                            <strong>Abmelden</strong>
                        </a>
                        {% endif %}
                    </div>



                    <div class="navbar-end">
                        <div class="navbar-item">
                            <div class="buttons">
                                {% if not current_user.is_authenticated %}
                                <a href="{{ url_for('auth.login') }}" class="button is-primary">
                                    <strong>Anmelden</strong>
                                </a>
                                {% endif %}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </nav>

    <section class="is-primary is-fullheight">
        {% block content %}
        {% endblock %}
    </section>

</body>

</html>

{% extends "base.html" %}

{% block content %}

<section class="hero is-fullheight">
    <div class="hero-body">
        <div class="container has-text-centered">
            <section class="section">
                <p class="title has-text-white">Anmelden</p>

                <div class="box">
                    {% with messages = get_flashed_messages() %}
                    {% if messages %}
                    <div class="notification is-danger">
                        {{ messages[0] }}
                    </div>
                    {% endif %}
                    {% endwith %}

                    <form method="POST" action="{{ url_for('auth.login_some') }}">
                        <div class="field">
                            <div class="control">
                                <input class="input is-large" name="username" placeholder="Nutzername">
                            </div>
                        </div>

                        <div class="field">
                            <div class="control">
                                <input class="input is-large" type="password" name="password" placeholder="Passwort">
                            </div>
                        </div>

                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

                        <button class="button is-block is-info is-large is-fullwidth">Anmelden</button>
                    </form>
                </div>
            </section>
        </div>
    </div>

</section>

<style>
    html {
        background: linear-gradient(to right, #159957, #155799);
    }
</style>

{% endblock %}

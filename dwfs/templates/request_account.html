{% extends "base.html" %}

{% block content %}

<section class="hero is-fullheight">
    <div class="hero-body">
        <div class="container has-text-centered">
            <section class="section">
                <p class="title has-text-white">Registrieren</p>

                <div class="box">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                    <div class="notification {{ 'is-success' if category == 'success' else 'is-danger' }}">
                        {{ message }}
                    </div>
                    {% endfor %}
                    {% endwith %}

                    <form method="POST" action="{{ url_for('main.req_new_acc') }}">
                        <div class="field">
                            <div class="control">
                                <input name="username" class="input is-large" type="text" placeholder="Nutzername">
                            </div>
                        </div>
                        <div class="field">
                            <div class="control">
                                <input name="password" class="input is-large" type="password" placeholder="Passwort">
                            </div>
                        </div>
    
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                        <button class="button is-block is-info is-large is-fullwidth">Senden</button>
                    </form>
                </div>
            </section>
        </div>
    </div>

</section>

<style>
    html {
        background: linear-gradient(to right, #159957, #155799);
    }
</style>

{% endblock %}
